name: Integración Continua (CI)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5

      - name: Instalar dependencias con uv sync
        run: uv sync --frozen --all-groups

      - name: Ejecutar pruebas con pytest
        run: uv run pytest
        
      - name: Instalar librerías del sistema para Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3

      - name: Ejecutar pruebas con pytest
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest